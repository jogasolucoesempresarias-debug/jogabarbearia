<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>JOGA Barbearia — Relatórios</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <div class="topbar"><div class="brandlogo"><div class="ic">B</div><div><h1>Comissões</h1><div class="sub">Fechamento por barbeiro</div></div></div></div>

  <div class="card">
    <div class="field"><label>Quinzena</label>
      <select id="quinzena" onchange="aplicarQuinzena()"></select></div>
    <div class="filters">
      <div class="field"><label>De</label><input type="date" id="de" onchange="carregar()"></div>
      <div class="field"><label>Até</label><input type="date" id="ate" onchange="carregar()"></div>
    </div>
    <div class="field"><label>Barbeiro</label><select id="f-barbeiro" onchange="renderLista()"><option value="">Todos</option></select></div>
  </div>

  <div class="grid2">
    <div class="card kpi"><div class="label">Arrecadação dos planos</div><div class="value" id="arrecad">—</div></div>
    <div class="card kpi"><div class="label" id="bolo-label">Bolo da equipe</div><div class="value pos" id="bolo">—</div>
      <div class="ri-sub muted" id="bolo-sub"></div></div>
  </div>
  <div class="card kpi"><div class="label">Total de comissões (avulso + bolo)</div><div class="value" id="total">—</div></div>
  <div class="section-title">Por barbeiro</div>
  <div id="bulk"></div>
  <div class="list" id="lista"><div class="empty">Carregando…</div></div>
</div>

<script src="/static/app.js"></script>
<script>
function quinzenas() {
  const hj = new Date(); const out = [];
  for (let i=0;i<4;i++) {
    const base = new Date(hj.getFullYear(), hj.getMonth()-Math.floor(i/2), 1);
    const seg = i%2; // 0 = 1-15 atual, alterna
  }
  // gera as últimas 4 quinzenas simples
  const res = [];
  let y = hj.getFullYear(), m = hj.getMonth();
  for (let k=0;k<4;k++) {
    const ult = new Date(y, m+1, 0).getDate();
    res.push({ label:`16–${ult}/${String(m+1).padStart(2,'0')}`, de:`${y}-${String(m+1).padStart(2,'0')}-16`, ate:`${y}-${String(m+1).padStart(2,'0')}-${ult}` });
    res.push({ label:`01–15/${String(m+1).padStart(2,'0')}`, de:`${y}-${String(m+1).padStart(2,'0')}-01`, ate:`${y}-${String(m+1).padStart(2,'0')}-15` });
    m--; if (m<0){m=11;y--;}
  }
  return res;
}
function aplicarQuinzena() {
  const v = document.getElementById('quinzena').value;
  if (!v) return; const [de,ate] = v.split('|');
  document.getElementById('de').value = de; document.getElementById('ate').value = ate; carregar();
}
let PERIODO = {}, ROWS = [];
async function carregar() {
  const de = document.getElementById('de').value, ate = document.getElementById('ate').value;
  try {
    const j = await api(`/api/relatorios/comissao?de=${de}&ate=${ate}`);
    document.getElementById('arrecad').textContent = money(j.plan_revenue);
    document.getElementById('bolo').textContent = money(j.pool);
    document.getElementById('bolo-label').textContent = `Bolo da equipe (${j.pool_pct}%)`;
    // O que não foi distribuído fica com a casa (fatia de quem não recebe comissão, ou ninguém
    // atendeu assinante no período). Sem isso a soma dos barbeiros "não bate" e ninguém entende.
    const sub = document.getElementById('bolo-sub');
    if (j.pool_retido > 0.005) sub.textContent = `distribuído ${money(j.pool_distribuido)} · retido pela casa ${money(j.pool_retido)}`;
    else if (j.plan_revenue > j.pool_revenue) sub.textContent = `sobre ${money(j.pool_revenue)} de planos com regra "bolo"`;
    else sub.textContent = '';
    document.getElementById('total').textContent = money(j.total);
    PERIODO = { de, ate };
    ROWS = j.rows;
    // popula o filtro de barbeiro (preserva a seleção)
    const sel = document.getElementById('f-barbeiro'); const atual = sel.value;
    sel.innerHTML = '<option value="">Todos</option>' +
      ROWS.map(r=>`<option value="${r.profissional_id}">${escapeHtml(r.profissional)}</option>`).join('');
    sel.value = atual;
    renderLista();
  } catch (e) { toast(e.message, 'err'); }
}

function renderLista() {
  const filtro = document.getElementById('f-barbeiro').value;
  const rows = filtro ? ROWS.filter(r => String(r.profissional_id) === filtro) : ROWS;
  const pendentes = rows.filter(r => !r.pago);

  // botão "fechar todos os pendentes (filtrados)"
  const bulk = document.getElementById('bulk');
  if (pendentes.length > 1) {
    const totPend = pendentes.reduce((s, r) => s + Number(r.total), 0);
    bulk.innerHTML = `<button class="btn btn-primary btn-block" style="margin-bottom:10px" onclick="fecharTodos()">Fechar e pagar TODOS os ${pendentes.length} pendentes (${money(totPend)})</button>`;
  } else { bulk.innerHTML = ''; }

  document.getElementById('lista').innerHTML = rows.length
    ? rows.map(r=>`<div class="row-item" style="flex-wrap:wrap"><div>
        <div class="ri-main">${escapeHtml(r.profissional||'—')} ${r.pago?'<span class="badge pago">pago</span>':'<span class="badge previsto">pendente</span>'}</div>
        <div class="ri-sub">${composicao(r)}</div>
        ${r.pago&&r.ajuste_motivo?`<div class="ri-sub muted">ajustado p/ ${money(r.valor_pago)} — ${escapeHtml(r.ajuste_motivo)}</div>`:''}</div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
          <div class="ri-right" style="color:var(--green)">${money(r.total)}</div>
          ${r.pago?'':`<button class="btn btn-sm btn-primary" onclick="abrirFechamento(${r.profissional_id})">Fechar e pagar</button>`}
        </div>
        <div id="fech-${r.profissional_id}" style="display:none;width:100%;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
          <div class="field"><label>Valor a pagar</label><input type="number" inputmode="decimal" id="fv-${r.profissional_id}" value="${r.total}" oninput="mostrarMotivo(${r.profissional_id}, ${r.total})"></div>
          <div class="field" id="fm-box-${r.profissional_id}" style="display:none"><label>Motivo do ajuste (fica no histórico)</label><input id="fm-${r.profissional_id}" placeholder="ex.: vale adiantado, acerto do mês passado"></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" style="flex:1" onclick="confirmarFechamento(${r.profissional_id})">Confirmar</button>
            <button class="btn btn-ghost" onclick="document.getElementById('fech-${r.profissional_id}').style.display='none'">Cancelar</button>
          </div>
        </div></div>`).join('')
    : '<div class="empty">Nenhum atendimento no período.</div>';
}

function composicao(r) {
  const p = [`avulso ${money(r.avulso)}`];
  if (r.assinante_direto > 0) p.push(`assinante ${money(r.assinante_direto)}`);
  if (r.pool_share > 0 || r.atend > 0) p.push(`bolo ${money(r.pool_share)} <span class="muted">(${r.participacao_pct}% · ${r.atend} atend.)</span>`);
  return p.join(' · ');
}
function abrirFechamento(pid) {
  const el = document.getElementById('fech-'+pid);
  el.style.display = el.style.display==='none' ? '' : 'none';
}
function mostrarMotivo(pid, calculado) {
  const v = Number(document.getElementById('fv-'+pid).value);
  document.getElementById('fm-box-'+pid).style.display = Math.abs(v - calculado) >= 0.01 ? '' : 'none';
}
async function confirmarFechamento(pid) {
  const valor = Number(document.getElementById('fv-'+pid).value);
  const motivoEl = document.getElementById('fm-'+pid);
  if (!(valor >= 0)) return toast('Valor inválido', 'err');
  if (!confirm(`Fechar e pagar ${money(valor)} de comissão? Vira despesa no caixa.`)) return;
  try {
    await api('/api/comissoes/fechar', { method:'POST', body:{ profissional_id: pid, de: PERIODO.de, ate: PERIODO.ate, valor, ajuste_motivo: motivoEl ? motivoEl.value : '' } });
    toast('Comissão fechada e lançada no caixa!', 'ok'); carregar();
  } catch (e) { toast(e.message, 'err'); }
}

async function fecharTodos() {
  const filtro = document.getElementById('f-barbeiro').value;
  const rows = (filtro ? ROWS.filter(r => String(r.profissional_id) === filtro) : ROWS).filter(r => !r.pago);
  if (!rows.length) return;
  const tot = rows.reduce((s, r) => s + Number(r.total), 0);
  if (!confirm(`Fechar e pagar ${rows.length} comissões (${money(tot)})? Cada uma vira despesa no caixa.`)) return;
  let ok = 0;
  for (const r of rows) {
    try {
      await api('/api/comissoes/fechar', { method:'POST', body:{ profissional_id: r.profissional_id, de: PERIODO.de, ate: PERIODO.ate, valor: r.total } });
      ok++;
    } catch (e) { toast(`${r.profissional}: ${e.message}`, 'err'); }
  }
  toast(`${ok} comissão(ões) fechada(s) e lançada(s) no caixa.`, 'ok');
  carregar();
}
const qs = quinzenas();
document.getElementById('quinzena').innerHTML = qs.map(q=>`<option value="${q.de}|${q.ate}">${q.label}</option>`).join('');
// quinzena atual = primeira que contém hoje
const hj = new Date().getDate();
document.getElementById('quinzena').selectedIndex = hj<=15 ? 1 : 0;
aplicarQuinzena();
renderShell('/mais');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
