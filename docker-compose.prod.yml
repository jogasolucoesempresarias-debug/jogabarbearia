version: '3.8'

services:
  barbearia-app:
    image: ghcr.io/jogasolucoesempresarias-debug/jogabarbearia:latest
    networks:
      - proxy
      - barbearia-internal
    environment:
      TZ: America/Sao_Paulo
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: postgres_postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-joga_barbearia}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_SENHA_INICIAL: ${SEED_SENHA_INICIAL:-joga123}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.routers.barbearia.rule=Host(`barbearia.jogasolucoes.com.br`)"
        - "traefik.http.routers.barbearia.entrypoints=websecure"
        - "traefik.http.routers.barbearia.tls.certresolver=le"
        - "traefik.http.services.barbearia.loadbalancer.server.port=5000"

networks:
  proxy:
    external: true
  barbearia-internal:
    driver: overlay
