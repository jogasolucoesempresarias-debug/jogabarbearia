<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>JOGA Barbearia — Configurações</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* Cartaz do QR de cadastro — bonito na tela e na impressão (PDF) */
  /* Campo de taxa dentro da linha da lista (fora de .field, que é quem carrega o estilo padrão) */
  .taxa-inp { width:76px; padding:8px 9px; background:var(--surface2); border:1px solid var(--border);
              border-radius:9px; color:var(--text); font-family:inherit; font-size:16px; text-align:right; }
  .taxa-inp:focus { outline:none; border-color:var(--accent); }
  .qr-cartaz { position:relative; background:#fff; color:#0f172a; border-radius:20px; padding:30px 24px 22px; text-align:center; margin:14px 0; overflow:hidden; box-shadow:0 12px 34px rgba(0,0,0,0.28); }
  .qr-cartaz .qr-bar { position:absolute; top:0; left:0; right:0; height:8px; }                 /* cor da marca (inline) */
  .qr-cartaz .qr-mono { width:56px; height:56px; border-radius:16px; margin:8px auto 14px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:1.55rem; box-shadow:0 8px 18px rgba(15,23,42,0.22); }
  .qr-cartaz .qr-titulo { font-size:1.45rem; font-weight:800; letter-spacing:-0.01em; line-height:1.15; }
  .qr-cartaz .qr-sub { color:#64748b; font-size:0.92rem; margin:6px 0 20px; }
  .qr-cartaz .qr-frame { display:inline-block; padding:16px; background:#fff; border:1px solid #e6eaf0; border-radius:18px; box-shadow:0 4px 16px rgba(15,23,42,0.08); max-width:100%; }
  .qr-cartaz .qrbox { display:inline-block; line-height:0; }
  .qr-cartaz .qrbox img, .qr-cartaz .qrbox canvas { display:block; max-width:100%; height:auto; }
  .qr-cartaz .qr-instr { margin-top:18px; font-size:0.95rem; font-weight:600; color:#334155; }
  .qr-cartaz .qr-link { margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:0.74rem; color:#94a3b8; word-break:break-all; }
  .qr-cartaz .qr-rodape { margin-top:20px; padding-top:14px; border-top:1px solid #f1f5f9; font-size:0.64rem; letter-spacing:0.1em; text-transform:uppercase; color:#cbd5e1; font-weight:700; }
  @media print {
    @page { margin:14mm; }
    body * { visibility:hidden; }
    #qr-cartaz, #qr-cartaz * { visibility:visible; }
    #qr-cartaz { position:absolute; left:50%; top:0; transform:translateX(-50%); width:auto; max-width:540px; margin:0; box-shadow:none; border:1px solid #e6eaf0; }
    #qr-cartaz .qr-mono { width:64px; height:64px; font-size:1.8rem; }
    #qr-cartaz .qr-titulo { font-size:2.1rem; }
    #qr-cartaz .qr-sub { font-size:1.1rem; }
    #qr-cartaz .qr-instr { font-size:1.1rem; }
    #qr-cartaz .qrbox img, #qr-cartaz .qrbox canvas { width:300px; height:300px; image-rendering:pixelated; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="brandlogo"><div class="ic">B</div><div><h1>Configurações</h1><div class="sub">Cadastros e políticas</div></div></div></div>
  <div class="tabs">
    <button class="active" data-t="serv" onclick="tab('serv',this)">Serviços</button>
    <button data-t="prod" onclick="tab('prod',this)">Produtos</button>
    <button data-t="prof" onclick="tab('prof',this)">Barbeiros</button>
    <button data-t="plano" onclick="tab('plano',this)">Planos</button>
    <button data-t="pgto" onclick="tab('pgto',this)">Pagamentos</button>
    <button data-t="agonline" onclick="tab('agonline',this)">Agendamento</button>
    <button data-t="geral" onclick="tab('geral',this)">Geral</button>
    <button data-t="qr" onclick="tab('qr',this)">QR Cadastro</button>
  </div>
  <div id="painel"><div class="empty">Carregando…</div></div>
</div>

<script src="/static/app.js"></script>
<script src="/static/qrcode.min.js"></script>
<script>
let ATUAL='serv', SERVICOS=[], CFG={};
// Cor do app (fixa no app.css). Não existe cor por barbearia: o tema é o mesmo em todas.
const ACCENT = '#38bdf8';
function tab(t,btn){ ATUAL=t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }

async function render() {
  const p = document.getElementById('painel');
  if (ATUAL==='serv') {
    const { rows } = await api('/api/servicos');
    p.innerHTML = formAdd('Novo serviço',[['s-nome','Nome','text'],['s-preco','Preço','number'],['s-dur','Duração (min)','number']],'addServ()') +
      '<div class="list">'+rows.map(s=>`<div class="row-item"><div><div class="ri-main">${escapeHtml(s.nome)}</div><div class="ri-sub">${s.duracao_min}min</div></div><div style="display:flex;gap:8px;align-items:center"><div class="ri-right">${money(s.preco)}</div><button class="btn btn-sm btn-danger" onclick="delItem('servicos',${s.id})">×</button></div></div>`).join('')+'</div>';
  } else if (ATUAL==='prod') {
    const { rows } = await api('/api/produtos');
    p.innerHTML = formAdd('Novo produto',[['p-nome','Nome','text'],['p-preco','Preço','number']],'addProd()') +
      '<div class="list">'+rows.map(s=>`<div class="row-item"><div class="ri-main">${escapeHtml(s.nome)}</div><div style="display:flex;gap:8px;align-items:center"><div class="ri-right">${money(s.preco)}</div><button class="btn btn-sm btn-danger" onclick="delItem('produtos',${s.id})">×</button></div></div>`).join('')+'</div>';
  } else if (ATUAL==='prof') {
    const { rows } = await api('/api/profissionais');
    p.innerHTML = `<div class="card"><div class="section-title" style="margin-top:0">Novo barbeiro</div>
        <div class="field"><label>Nome</label><input id="b-nome"></div>
        <div class="field"><label>Comissão %</label><input id="b-com" type="number" inputmode="decimal" value="45"></div>
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><input type="checkbox" id="b-recebe" checked style="width:auto"> Recebe comissão</label>
        <button class="btn btn-primary btn-block" onclick="addProf()">+ Adicionar</button></div>` +
      '<div class="list">'+rows.map(s=>`<div class="row-item"><div><div class="ri-main"><span class="dot" style="background:${s.cor_agenda}"></span>${escapeHtml(s.nome)}</div>
        <div class="ri-sub">${s.comissao_pct}% · comissão: ${s.recebe_comissao?'<span style="color:var(--green)">sim</span>':'<span style="color:var(--text-dim)">não (dono)</span>'}</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn btn-sm" onclick="toggleComissao(${s.id},${!s.recebe_comissao})">${s.recebe_comissao?'tirar comissão':'dar comissão'}</button>
          <button class="btn btn-sm btn-danger" onclick="delItem('profissionais',${s.id})">×</button></div></div>`).join('')+'</div>';
  } else if (ATUAL==='plano') {
    SERVICOS = (await api('/api/servicos')).rows;
    const { rows } = await api('/api/planos');
    p.innerHTML = `<div class="card"><button class="btn btn-primary btn-block" onclick="novoPlano()">+ Novo plano</button></div>` +
      '<div class="list">'+rows.map(pl=>`<div class="row-item" onclick='editarPlano(${JSON.stringify(pl)})'><div><div class="ri-main">${escapeHtml(pl.nome)}</div><div class="ri-sub">${money(pl.valor_mensal)}/mês · ${(pl.servicos||[]).map(x=>x.nome).join(', ')||'sem serviço'}</div><div class="ri-sub muted">comissão: ${rotuloRegra(pl)}</div></div><div class="muted">›</div></div>`).join('')+'</div>';
  } else if (ATUAL==='pgto') {
    const { rows } = await api('/api/formas-pagamento');
    p.innerHTML = `<div class="card">
        <div class="section-title" style="margin-top:0">Nova forma de pagamento</div>
        <div class="field"><label>Nome</label><input id="fp-nome" placeholder="Ex.: Crédito"></div>
        <div class="field"><label>Taxa da maquininha (%)</label><input id="fp-taxa" type="number" inputmode="decimal" step="0.01" value="0"></div>
        <button class="btn btn-primary btn-block" onclick="addForma()">+ Adicionar</button></div>
      <div class="card" style="border-color:rgba(56,189,248,.3)">
        <div class="ri-sub" style="margin:0">A cada venda nessa forma, o sistema lança a taxa como despesa em
        <strong>“Taxas de cartão”</strong>. A receita continua <strong>cheia</strong> — o que o cliente pagou —
        para a comissão do barbeiro não mudar conforme a maquininha. Dinheiro e Pix ficam em 0%.</div></div>
      <div class="section-title">Formas cadastradas</div>
      <div class="list">` + rows.map(f=>`
        <div class="row-item">
          <div style="flex:1">
            <div class="ri-main">${escapeHtml(f.nome)} ${f.ativo?'':'<span class="badge dim">inativa</span>'}</div>
            <div class="ri-sub">${Number(f.taxa_pct)>0?('taxa de '+Number(f.taxa_pct).toFixed(2).replace('.',',')+'%'):'sem taxa'}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <input class="taxa-inp" type="number" step="0.01" min="0" inputmode="decimal" value="${Number(f.taxa_pct)}"
                   onchange="salvarTaxa(${f.id},this.value)" title="Taxa %">
            <button class="btn btn-sm" onclick="toggleForma(${f.id},${!f.ativo})">${f.ativo?'desativar':'ativar'}</button>
          </div></div>`).join('') + '</div>';
  } else if (ATUAL==='agonline') {
    CFG = (await api('/api/config')).config;
    const profs = (await api('/api/profissionais')).rows;
    const url = location.origin + '/agendamento';
    const on = !!CFG.agendamento_online;
    p.innerHTML = `<div class="card">
        <div class="section-title" style="margin-top:0">Agendamento online</div>
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <input type="checkbox" id="ag-on" ${on?'checked':''} style="width:auto"> <strong>Ligado</strong></label>
        <div class="hint" style="margin-bottom:14px">Desligado, o link fica fora do ar e ninguém consegue marcar sozinho.</div>
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <input type="checkbox" id="ag-manual" ${CFG.agendamento_confirmar_manual?'checked':''} style="width:auto"> Eu confirmo cada agendamento</label>
        <div class="hint" style="margin-bottom:14px">Ligado, o pedido chega como <strong>pendente</strong> e você aceita na Agenda.
          Desligado, cai direto no horário.</div>
        <div class="field"><label>Antecedência mínima (horas)</label>
          <input id="ag-antec" type="number" inputmode="numeric" min="0" value="${CFG.agendamento_antecedencia_horas ?? 2}"></div>
        <div class="field"><label>Pode marcar com quantos dias de antecedência</label>
          <input id="ag-janela" type="number" inputmode="numeric" min="1" value="${CFG.agendamento_janela_dias ?? 30}"></div>
        <div class="field"><label>Endereço (aparece na mensagem de confirmação)</label>
          <input id="ag-end" value="${escapeHtml(CFG.marca_endereco||'')}"></div>
        <button class="btn btn-primary btn-block" onclick="salvarAgOnline()">Salvar</button>
      </div>

      <div class="section-title">Quem aparece no link</div>
      <div class="list">${profs.map(s=>`<div class="row-item">
          <div><div class="ri-main"><span class="dot" style="background:${s.cor_agenda}"></span>${escapeHtml(s.nome)}</div>
            <div class="ri-sub">${s.aceita_online?'<span style="color:var(--green)">aceita agendamento online</span>':'<span class="muted">fora do agendamento online</span>'}</div></div>
          <button class="btn btn-sm" onclick="toggleOnline(${s.id},${!s.aceita_online})">${s.aceita_online?'tirar':'incluir'}</button>
        </div>`).join('')}</div>

      ${on ? `<div class="section-title">Cartaz do link</div>
      <div class="card">
        <div class="hint" style="margin-bottom:6px">Mande o link no Instagram, no status do WhatsApp e no Google. Imprima o cartaz pro balcão.</div>
        <div class="qr-cartaz" id="qr-cartaz">
          <div class="qr-bar" style="background:${ACCENT}"></div>
          <div class="qr-mono" style="background:${ACCENT}">${escapeHtml((CFG.marca_nome||'B').trim().charAt(0).toUpperCase())}</div>
          <div class="qr-titulo">${escapeHtml(CFG.marca_nome||'Barbearia')}</div>
          <div class="qr-sub">Agende seu horário pelo celular, a qualquer hora</div>
          <div class="qr-frame"><div class="qrbox" id="qrbox"></div></div>
          <div class="qr-instr">📷 Aponte a câmera do celular para o código</div>
          <div class="qr-link">${escapeHtml(url.replace(/^https?:\/\//,''))}</div>
          <div class="qr-rodape">JOGA · Soluções Empresariais</div>
        </div>
        <button class="btn btn-primary btn-block" onclick="window.print()">🖨️ Imprimir cartaz</button>
        <button class="btn btn-block" style="margin-top:8px" onclick="copiarLink('${url}')">🔗 Copiar link</button>
      </div>` : ''}`;
    if (on) {
      const box = document.getElementById('qrbox'); box.innerHTML = '';
      new QRCode(box, { text: url, width: 220, height: 220, colorDark: '#0f172a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    }
  } else if (ATUAL==='qr') {
    CFG = (await api('/api/config')).config;
    const url = location.origin + '/cadastro';
    const nome = CFG.marca_nome || 'Barbearia';
    const cor = ACCENT;                      // o cartaz usa a mesma cor do app (não há cor por cliente)
    const inicial = escapeHtml(nome.trim().charAt(0).toUpperCase() || 'B');
    const urlBonita = escapeHtml(url.replace(/^https?:\/\//, ''));
    p.innerHTML = `<div class="card">
        <div class="section-title" style="margin-top:0">QR de autocadastro</div>
        <div class="hint" style="margin-bottom:6px">O cliente aponta a câmera, preenche nome e telefone, e o cadastro aparece em <strong>Clientes</strong> aguardando sua aprovação. Imprima e deixe no balcão/espelho.</div>
        <div class="qr-cartaz" id="qr-cartaz">
          <div class="qr-bar" style="background:${cor}"></div>
          <div class="qr-mono" style="background:${cor}">${inicial}</div>
          <div class="qr-titulo">${escapeHtml(nome)}</div>
          <div class="qr-sub">Cadastre-se em segundos e agilize seu atendimento</div>
          <div class="qr-frame"><div class="qrbox" id="qrbox"></div></div>
          <div class="qr-instr">📷 Aponte a câmera do celular para o código</div>
          <div class="qr-link">${urlBonita}</div>
          <div class="qr-rodape">JOGA · Soluções Empresariais</div>
        </div>
        <button class="btn btn-primary btn-block" onclick="window.print()">🖨️ Imprimir cartaz</button>
      </div>`;
    const box = document.getElementById('qrbox'); box.innerHTML = '';
    new QRCode(box, { text: url, width: 220, height: 220, colorDark: '#0f172a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  } else {
    CFG = (await api('/api/config')).config;
    const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    p.innerHTML = `<div class="card">
      <div class="field"><label>Nome da barbearia (marca)</label><input id="g-nome" value="${escapeHtml(CFG.marca_nome||'')}"></div>
      <div class="field"><label>Categorias de despesa (separadas por vírgula)</label><input id="g-catdesp" value="${(CFG.categorias_despesa||[]).join(', ')}"></div>
      <div class="hint" style="margin:-6px 0 12px">Formas de pagamento agora ficam na aba <strong>Pagamentos</strong> (é lá que fica a taxa da maquininha).</div>
      <div class="field"><label>% do bolo dos planos (comissão de assinante)</label><input id="g-bolo" type="number" inputmode="decimal" step="0.5" value="${CFG.comissao_padrao||45}"></div>
      <div class="hint" style="margin-bottom:10px">Vale só para os planos com regra <strong>bolo</strong>: essa fatia da arrecadação deles é rateada entre os barbeiros pela produção. Planos com regra <em>tabela</em>, <em>fixo</em> ou <em>zero</em> não usam este número.</div>
      <button class="btn btn-primary btn-block" onclick="salvarGeral()">Salvar geral</button>
    </div>
    <div class="section-title">Horário de funcionamento</div>
    <div class="card">${dias.map((d,i)=>{const h=(CFG.horarios||{})[String(i)];return `<div class="filters"><div style="width:42px;align-self:center;font-weight:700">${d}</div><div class="field"><label>Abre</label><input type="time" id="h-${i}-a" value="${h?h.abre:''}"></div><div class="field"><label>Fecha</label><input type="time" id="h-${i}-f" value="${h?h.fecha:''}"></div></div>`;}).join('')}
      <div class="hint" style="margin-bottom:10px">Deixe vazio = fechado nesse dia.</div>
      <button class="btn btn-primary btn-block" onclick="salvarHorarios()">Salvar horários</button>
    </div>`;
  }
}
function formAdd(titulo, campos, onclick) {
  return `<div class="card"><div class="section-title" style="margin-top:0">${titulo}</div>${campos.map(c=>`<div class="field"><label>${c[1]}</label><input id="${c[0]}" type="${c[2]}" ${c[2]==='number'?'inputmode="decimal"':''}></div>`).join('')}<button class="btn btn-primary btn-block" onclick="${onclick}">+ Adicionar</button></div>`;
}
const V=id=>document.getElementById(id).value;
async function addServ(){ try{ await api('/api/servicos',{method:'POST',body:{nome:V('s-nome'),preco:V('s-preco'),duracao_min:V('s-dur')||30}}); toast('Criado!','ok'); render(); }catch(e){toast(e.message,'err');} }
async function addProd(){ try{ await api('/api/produtos',{method:'POST',body:{nome:V('p-nome'),preco:V('p-preco')}}); toast('Criado!','ok'); render(); }catch(e){toast(e.message,'err');} }
async function addProf(){ try{ await api('/api/profissionais',{method:'POST',body:{nome:V('b-nome'),comissao_pct:V('b-com')||45,recebe_comissao:document.getElementById('b-recebe').checked}}); toast('Criado!','ok'); render(); }catch(e){toast(e.message,'err');} }
async function toggleComissao(id, novo){ try{ await api('/api/profissionais/'+id,{method:'PUT',body:{recebe_comissao:novo}}); toast('Atualizado.','ok'); render(); }catch(e){toast(e.message,'err');} }

// Agendamento online
async function salvarAgOnline(){
  try{
    await api('/api/config',{method:'PUT',body:{
      agendamento_online: document.getElementById('ag-on').checked,
      agendamento_confirmar_manual: document.getElementById('ag-manual').checked,
      agendamento_antecedencia_horas: Number(V('ag-antec'))||0,
      agendamento_janela_dias: Number(V('ag-janela'))||30,
      marca_endereco: V('ag-end'),
    }});
    toast('Salvo!','ok'); render();
  }catch(e){toast(e.message,'err');}
}
async function toggleOnline(id, valor){ try{ await api('/api/profissionais/'+id,{method:'PUT',body:{aceita_online:valor}}); toast('Atualizado.','ok'); render(); }catch(e){toast(e.message,'err');} }
async function copiarLink(url){ try{ await navigator.clipboard.writeText(url); toast('Link copiado!','ok'); }catch{ toast(url,'ok'); } }

// Formas de pagamento (a taxa da maquininha mora aqui)
async function addForma(){ try{ await api('/api/formas-pagamento',{method:'POST',body:{nome:V('fp-nome'),taxa_pct:V('fp-taxa')||0}}); toast('Criada!','ok'); render(); }catch(e){toast(e.message,'err');} }
async function salvarTaxa(id, valor){ try{ await api('/api/formas-pagamento/'+id,{method:'PUT',body:{taxa_pct:Number(valor)||0}}); toast('Taxa salva.','ok'); render(); }catch(e){toast(e.message,'err');} }
async function toggleForma(id, ativo){ try{ await api('/api/formas-pagamento/'+id,{method:'PUT',body:{ativo}}); toast('Atualizado.','ok'); render(); }catch(e){toast(e.message,'err');} }
async function delItem(rec,id){ if(!confirm('Excluir?'))return; try{ await api('/api/'+rec+'/'+id,{method:'DELETE'}); toast('Excluído.','ok'); render(); }catch(e){toast(e.message,'err');} }

// Planos
let editId=null;
function novoPlano(){ editId=null; abrirPlano({nome:'',valor_mensal:0,dias_inclusos:[1,2,3],comissao_assinante_regra:'tabela',servicos:[]}); }
function editarPlano(pl){ editId=pl.id; abrirPlano(pl); }
function abrirPlano(pl){
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const inc = pl.dias_inclusos||[];
  const servIds = (pl.servicos||[]).map(s=>s.id);
  const p = document.getElementById('painel');
  p.innerHTML = `<div class="card">
    <h2 style="margin-bottom:14px">${editId?'Editar':'Novo'} plano</h2>
    <div class="field"><label>Nome</label><input id="pl-nome" value="${escapeHtml(pl.nome)}"></div>
    <div class="field"><label>Valor mensal (R$)</label><input id="pl-valor" type="number" inputmode="decimal" value="${pl.valor_mensal||0}"></div>
    <div class="field"><label>Dias inclusos</label><div class="chips">${dias.map((d,i)=>`<button class="chip" id="dia-${i}" style="${inc.includes(i)?'border-color:var(--accent);color:var(--accent)':''}" onclick="toggleDia(${i})">${d}</button>`).join('')}</div></div>
    <div class="field"><label>Serviços inclusos</label><div class="chips">${SERVICOS.map(s=>`<button class="chip" id="srv-${s.id}" style="${servIds.includes(s.id)?'border-color:var(--accent);color:var(--accent)':''}" onclick="toggleSrv(${s.id})">${escapeHtml(s.nome)}</button>`).join('')}</div></div>
    <div class="section-title">Comissão do barbeiro neste plano</div>
    <div class="field"><select id="pl-regra" onchange="regraMudou()">
      ${REGRAS.map(r=>`<option value="${r[0]}" ${(pl.comissao_assinante_regra||'bolo')===r[0]?'selected':''}>${r[1]}</option>`).join('')}
    </select></div>
    <div class="field" id="pl-valor-box" style="display:none"><label>R$ por atendimento de assinante</label>
      <input id="pl-comvalor" type="number" inputmode="decimal" value="${pl.comissao_assinante_valor||''}"></div>
    <div class="hint" id="pl-regra-hint" style="margin-bottom:10px"></div>
    <button class="btn btn-primary btn-block" onclick="salvarPlano()">Salvar plano</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="render()">Voltar</button>
  </div>`;
  window._dias = [...inc]; window._srv = [...servIds];
  regraMudou();
}
const REGRAS = [
  ['bolo',   'Bolo rateado pela produção'],
  ['tabela', 'Como avulso (% sobre o preço cheio)'],
  ['fixo',   'R$ fixo por atendimento'],
  ['zero',   'Sem comissão'],
];
const REGRA_HINT = {
  bolo:   'Uma fatia da arrecadação deste plano (o % está em <strong>Geral</strong>) vira um bolo, rateado entre os barbeiros pela produção do período. É o modelo da barbearia da Regiane.',
  tabela: 'O assinante paga R$0, mas o barbeiro ganha a comissão normal dele sobre o <strong>preço cheio</strong> do serviço. Simples de explicar: pro barbeiro, assinante é igual a cliente comum.',
  fixo:   'O barbeiro ganha um valor fixo por atendimento de assinante, não importa o serviço. Se dois barbeiros atendem a mesma visita, cada um conta a sua.',
  zero:   'Atendimento de assinante não gera comissão nenhuma. Use com cuidado — costuma gerar atrito com a equipe.',
};
function rotuloRegra(pl){
  const r = pl.comissao_assinante_regra || 'bolo';
  if (r==='fixo') return `R$ fixo (${money(pl.comissao_assinante_valor||0)}/atendimento)`;
  return (REGRAS.find(x=>x[0]===r)||[,r])[1];
}
function regraMudou(){
  const el = document.getElementById('pl-regra'); if(!el) return;
  document.getElementById('pl-valor-box').style.display = el.value==='fixo' ? '' : 'none';
  document.getElementById('pl-regra-hint').innerHTML = REGRA_HINT[el.value] || '';
}
function toggleDia(i){ const a=window._dias; const idx=a.indexOf(i); if(idx<0)a.push(i);else a.splice(idx,1); const el=document.getElementById('dia-'+i); el.style=a.includes(i)?'border-color:var(--accent);color:var(--accent)':''; }
function toggleSrv(id){ const a=window._srv; const idx=a.indexOf(id); if(idx<0)a.push(id);else a.splice(idx,1); const el=document.getElementById('srv-'+id); el.style=a.includes(id)?'border-color:var(--accent);color:var(--accent)':''; }
async function salvarPlano(){
  const body={ nome:V('pl-nome'), valor_mensal:V('pl-valor'), dias_inclusos:window._dias, servicos:window._srv,
               comissao_assinante_regra:V('pl-regra'),
               comissao_assinante_valor: V('pl-regra')==='fixo' ? V('pl-comvalor') : null };
  try { if(editId) await api('/api/planos/'+editId,{method:'PUT',body}); else await api('/api/planos',{method:'POST',body}); toast('Plano salvo!','ok'); tab('plano',document.querySelector('[data-t=plano]')); }
  catch(e){ toast(e.message,'err'); }
}

async function salvarGeral(){
  try { await api('/api/config',{method:'PUT',body:{ marca_nome:V('g-nome'), comissao_padrao:V('g-bolo')||45, categorias_despesa:V('g-catdesp').split(',').map(s=>s.trim()).filter(Boolean) }}); toast('Salvo!','ok'); }
  catch(e){ toast(e.message,'err'); }
}
async function salvarHorarios(){
  const h={}; for(let i=0;i<7;i++){ const a=V('h-'+i+'-a'),f=V('h-'+i+'-f'); h[i]=(a&&f)?{abre:a,fecha:f}:null; }
  try { await api('/api/config',{method:'PUT',body:{horarios:h}}); toast('Horários salvos!','ok'); }
  catch(e){ toast(e.message,'err'); }
}

renderShell('/mais'); render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
